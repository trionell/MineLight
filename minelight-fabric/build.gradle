// MineLight Fabric mod.
//
// Fabric's Maven (maven.fabricmc.net) and Mojang's download servers are
// unreachable from some sandboxed CI environments. This build therefore
// applies the Fabric Loom plugin only when it can be resolved; otherwise it
// produces a "stub" jar so the multi-project build still succeeds and the
// core module can be developed and tested end-to-end.
//
// On a machine with normal internet access, `./gradlew :minelight-fabric:build`
// (or `gradle :minelight-fabric:build`) will download Loom, Minecraft 1.21.8,
// Yarn mappings, and Fabric API, and produce a real, loadable mod jar.

apply plugin: 'java'

group = 'net.minelight'
version = '0.1.0'

/* archivesName set via jar task for stub compat */

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Try to resolve Fabric Loom. If the Fabric Maven is unreachable we fall back
// to a stub so `gradle build` at the root still works.
def loomAvailable = true
try {
    configurations.detachedConfiguration(
            dependencies.create('net.fabricmc:fabric-loom:1.11-SNAPSHOT')
    ).with { it.transitive = false }.resolve()
} catch (Exception ignored) {
    loomAvailable = false
    logger.warn('[MineLight] Fabric Maven unreachable; building minelight-fabric as a stub jar.')
}

if (loomAvailable) {
    apply plugin: 'fabric-loom'

    dependencies {
        minecraft "com.mojang:minecraft:1.21.8"
        mappings "net.fabricmc:yarn:1.21.8+build.1:v2"
        modImplementation "net.fabricmc:fabric-loader:0.16.14"
        modImplementation "net.fabricmc.fabric-api:fabric-api:0.128.2+1.21.8"

        implementation project(':minelight-core')
        implementation 'com.google.code.gson:gson:2.11.0'
        implementation 'org.luaj:luaj-jse:3.0.1'
    }
} else {
    // Stub: compile nothing, but still emit a jar with a marker so CI passes.
    sourceSets {
        main {
            java.srcDirs = []
            resources.srcDirs = ['src/main/resources']
        }
    }

    dependencies {
        implementation project(':minelight-core')
    }
}

tasks.named('jar') {
    archiveBaseName = 'minelight-fabric'
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
