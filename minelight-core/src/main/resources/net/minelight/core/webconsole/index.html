<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MineLight Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121824;
    --panel-2: #0e141d;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #f7782f; /* lava orange */
    --accent-2: #5fd0ff;
    --ok: #4ade80;
    --bad: #f87171;
    --warn: #fbbf24;
    --border: #1f2a38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header {
    display:flex; align-items:center; gap:12px; padding:10px 16px;
    background:linear-gradient(90deg,#1a1206,#0b0f14 60%);
    border-bottom:1px solid var(--border);
  }
  header h1 { font-size:16px; margin:0; letter-spacing:1px; }
  header .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); }
  header .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  header .counts { margin-left:auto; font-size:12px; color:var(--muted); }
  header .counts b { color:var(--accent-2); font-weight:normal; }
  main { display:grid; grid-template-columns: 1fr 380px; gap:12px; padding:12px; align-items:start; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:12px; }
  .panel h2 { margin:0 0 10px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:8px; }
  .chan { background:var(--panel-2); border:1px solid var(--border); border-radius:6px; padding:8px; position:relative; }
  .chan .name { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chan .val { font-size:18px; margin:4px 0; color:var(--accent-2); }
  .chan .bar { height:60px; background:#000; border-radius:4px; position:relative; overflow:hidden; }
  .chan .bar i { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(180deg,var(--accent),#7a2d00); }
  .chan .rs { position:absolute; top:6px; right:6px; width:10px; height:10px; border-radius:2px; background:#333; }
  .chan .rs.on { background:var(--accent); box-shadow:0 0 8px var(--accent); }
  .chan .meta { font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; align-items:center; }
  button, input, select, textarea {
    background:var(--panel-2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:6px 10px; font:inherit; font-size:13px;
  }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.go { background:var(--accent); color:#000; font-weight:bold; border:none; padding:10px 22px; font-size:16px; }
  button.go:hover { filter:brightness(1.1); }
  textarea { width:100%; height:260px; resize:vertical; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .tabs button.active { border-color:var(--accent); color:var(--accent); }
  #presets button { min-width:80px; }
  .log { height:140px; overflow:auto; background:#000; border-radius:6px; padding:8px; font-size:12px; color:var(--muted); }

  /* ---- monitor views ---- */
  .empty { color:var(--muted); font-size:12px; padding:8px 0; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:10px; }
  .card { background:var(--panel-2); border:1px solid var(--border); border-radius:6px; padding:10px; }
  .card .head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .card .head .id { color:var(--muted); font-size:12px; }
  .card .head .title { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .head .tag {
    margin-left:auto; font-size:10px; letter-spacing:1px; padding:2px 6px;
    border:1px solid var(--border); border-radius:4px; color:var(--accent-2);
  }
  .card .pos { font-size:11px; color:var(--muted); margin-bottom:8px; }
  .group { margin-bottom:16px; }
  .group > h3 {
    margin:0 0 4px; font-size:11px; font-weight:normal; color:var(--muted);
    text-transform:uppercase; letter-spacing:1px;
  }
  .group > .blurb { font-size:11px; color:var(--muted); margin:0 0 8px; opacity:.75; }
  .tag.role-INPUT { color:var(--ok); }
  .tag.role-TRIGGER { color:var(--warn); }
  .tag.role-FIXTURE { color:var(--accent); }
  .swatch { width:34px; height:34px; border-radius:4px; border:1px solid var(--border); flex:none; }
  table.ports { width:100%; border-collapse:collapse; font-size:11px; }
  table.ports th { text-align:left; color:var(--muted); font-weight:normal; padding:2px 4px; }
  table.ports td { padding:3px 4px; border-top:1px solid var(--border); vertical-align:middle; }
  table.ports td.num { text-align:right; color:var(--accent-2); }
  .meter { height:8px; background:#000; border-radius:3px; overflow:hidden; min-width:60px; }
  .meter i { display:block; height:100%; background:linear-gradient(90deg,#7a2d00,var(--accent)); }
  .meter.cool i { background:linear-gradient(90deg,#124a63,var(--accent-2)); }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:11px; }
  .kv span:nth-child(odd) { color:var(--muted); }
  .pill { font-size:10px; padding:1px 6px; border-radius:10px; border:1px solid var(--border); color:var(--muted); }
  .pill.on { color:#000; background:var(--ok); border-color:var(--ok); }
  .pill.off { color:var(--muted); }
  .beat { width:12px; height:12px; border-radius:50%; background:#333; }
  .beat.on { background:var(--accent); box-shadow:0 0 10px var(--accent); }
  table.grid { width:100%; border-collapse:collapse; font-size:11px; }
  table.grid th { text-align:left; color:var(--muted); font-weight:normal; padding:4px 6px; border-bottom:1px solid var(--border); }
  table.grid td { padding:4px 6px; border-bottom:1px solid var(--border); }
  table.grid tr:last-child td { border-bottom:none; }
  .stale { color:var(--muted); }
  #signals { height:520px; overflow:auto; }
  #signals table { width:100%; border-collapse:collapse; font-size:11px; }
  #signals td { padding:2px 6px; border-bottom:1px solid var(--border); white-space:nowrap; }
  #signals td.time { color:var(--muted); width:90px; }
  #signals td.kind { width:150px; }
  #signals td.data { white-space:normal; color:var(--muted); }
  .k-block { color:var(--accent); }
  .k-sound { color:var(--accent-2); }
  .k-redstone { color:var(--warn); }
  .k-in { color:var(--ok); }
  .k-other { color:var(--text); }
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <h1>MINELIGHT CONSOLE</h1>
  <span id="status" style="color:var(--muted);font-size:12px"></span>
  <span class="counts" id="counts"></span>
</header>
<main>
  <section>
    <div class="tabs" id="tabs"></div>

    <div class="panel view" id="view-patch">
      <h2>Patch</h2>
      <div id="grid"></div>
      <div class="empty" id="patchEmpty" hidden>No fixtures patched.</div>
    </div>

    <div class="panel view" id="view-blocks" hidden>
      <h2>Blocks</h2>
      <div class="row" id="roleFilter"></div>
      <div id="blocks"></div>
      <div class="empty" id="blocksEmpty" hidden>
        No blocks placed. Place a dimmer, RGB, event, sound or feedback block in the world.
      </div>
    </div>

    <div class="panel view" id="view-devices" hidden>
      <h2>Devices</h2>
      <div class="cards"><div id="devices" style="display:contents"></div></div>
    </div>

    <div class="panel view" id="view-signals" hidden>
      <h2>Signals</h2>
      <div class="row">
        <input id="signalFilter" placeholder="filter kind, e.g. block. or artnet"
               oninput="renderSignals()" style="flex:1">
        <button id="pauseBtn" onclick="togglePause()">Pause</button>
        <button onclick="events=[];renderSignals()">Clear</button>
      </div>
      <div id="signals"></div>
    </div>
  </section>

  <aside>
    <div class="panel">
      <h2>Presets</h2>
      <div id="presets" class="row"></div>
      <div class="row">
        <input id="presetName" placeholder="new preset name">
        <button onclick="savePreset()">Save current</button>
      </div>
    </div>
    <div class="panel">
      <h2>Cue List</h2>
      <div class="row">
        <button class="go" onclick="cueGo()">GO</button>
        <input id="cueIndex" type="number" min="0" value="0" style="width:70px">
        <button onclick="cueGoIndex()">Go to</button>
      </div>
    </div>
    <div class="panel">
      <h2>Trigger Script (Lua)</h2>
      <div class="tabs">
        <button class="active">editor</button>
        <button onclick="reloadScript()">Apply</button>
      </div>
      <textarea id="script"></textarea>
    </div>
    <div class="panel">
      <h2>Log</h2>
      <div class="log" id="log"></div>
    </div>
  </aside>
</main>
<script>
const TABS = [
  {id:'patch',   label:'Patch'},
  {id:'blocks',  label:'Blocks'},
  {id:'devices', label:'Devices'},
  {id:'signals', label:'Signals'},
];
const MAX_SIGNALS = 500;

let source;
let state = {patch:{fixtures:[]}, dmx:{}, redstone:{}, presets:[], blocks:[], sound:[], devices:[]};
let events = [];
let paused = false;
let tab = 'patch';

function connect() {
  // Server-Sent Events, not a WebSocket: the engine's HTTP server cannot
  // deliver an upgraded connection's body. EventSource reconnects on its own.
  source = new EventSource('/events');
  source.onopen = () => { setConn(true); log('connected'); };
  source.onerror = () => { setConn(false); };
  source.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'state') {
      state = msg;
      events = (msg.events || []).slice().reverse();
      render();
    } else if (msg.type === 'live') {
      applyLive(msg);
    }
  };
}

function applyLive(msg) {
  // The server omits sections that have not changed, so an idle show sends
  // nothing and nothing below runs.
  if (msg.dmx) state.dmx = msg.dmx;
  if (msg.blocks) state.blocks = msg.blocks;
  if (msg.sound) state.sound = msg.sound;
  if (msg.redstone) state.redstone = msg.redstone;
  if (msg.devices) state.devices = msg.devices;
  if (msg.events && msg.events.length) {
    // newest first, capped — the server ring is the source of truth for history
    events = msg.events.slice().reverse().concat(events).slice(0, MAX_SIGNALS);
  }

  if (msg.blocks || msg.sound || msg.devices) renderCounts();
  if (tab === 'patch') {
    if (msg.dmx || msg.redstone) renderLevels();
  } else if (tab === 'blocks') {
    if (msg.blocks || msg.sound || msg.dmx) { renderRoleFilter(); renderBlocks(); }
  } else if (tab === 'devices') {
    if (msg.devices) renderDevices();
  } else if (tab === 'signals') {
    if (msg.events && msg.events.length) renderSignals();
  }
}

function setConn(on) {
  document.getElementById('dot').className = 'dot' + (on ? ' on' : '');
  document.getElementById('status').textContent = on ? 'live' : 'offline';
}

function send(obj) {
  fetch('/command', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(obj),
  }).catch(() => log('command failed'));
}

function renderTabs() {
  setHtml('tabs', TABS.map(t =>
    `<button class="${t.id === tab ? 'active' : ''}" onclick="selectTab('${t.id}')">${t.label}</button>`
  ).join(''));
}

let deviceAgeTimer = null;

function selectTab(id) {
  tab = id;
  for (const t of TABS) {
    document.getElementById('view-' + t.id).hidden = t.id !== id;
  }
  // Peer ages advance on their own, so the devices table needs a local tick.
  // Only while it is on screen: off screen it would be pure DOM churn.
  clearInterval(deviceAgeTimer);
  deviceAgeTimer = id === 'devices' ? setInterval(renderDevices, 1000) : null;
  renderTabs();
  render();
}

function render() {
  renderTabs();
  renderCounts();
  renderFixtures();
  renderRoleFilter();
  renderBlocks();
  renderDevices();
  renderSignals();
  renderPresets();
  const script = document.getElementById('script');
  if (document.activeElement !== script) script.value = state.script || '';
}

function renderCounts() {
  const devices = state.devices || [];
  const online = devices.filter(d => d.running).length;
  setHtml('counts',
    `patch <b>${(state.patch.fixtures || []).length}</b> · ` +
    `blocks <b>${allBlocks().length}</b> · ` +
    `devices <b>${online}/${devices.length}</b>`);
}

/* ---- patch ---- */

function renderFixtures() {
  const fixtures = state.patch.fixtures || [];
  document.getElementById('patchEmpty').hidden = fixtures.length > 0;
  const html = fixtures.map(f => `
    <div class="chan">
      <div class="rs" data-rs="${f.id}"></div>
      <div class="name">#${f.id} ${esc(f.name)}</div>
      <div class="val" data-val="${f.id}">0</div>
      <div class="bar"><i data-bar="${f.id}" style="height:0%"></i></div>
      <input type="range" min="0" max="255" value="0" style="width:100%"
        data-slider="${f.id}" oninput="onSlider(${f.id}, this.value)">
      <div class="meta">u${f.universe}.${f.address} · ${esc(f.mode)}</div>
      <div class="meta">${f.x}, ${f.y}, ${f.z} · ${esc(f.kind)}</div>
    </div>`).join('');
  if (setHtml('grid', html)) {
    // the grid was rebuilt, so the cached nodes are stale
    levelNodes = null;
  }
  renderLevels();
}

// Looking these up per fixture per frame was the other repeated DOM cost.
let levelNodes = null;

function cacheLevelNodes() {
  levelNodes = (state.patch.fixtures || []).map(f => ({
    f,
    val: document.querySelector(`[data-val="${f.id}"]`),
    bar: document.querySelector(`[data-bar="${f.id}"]`),
    slider: document.querySelector(`[data-slider="${f.id}"]`),
    rs: document.querySelector(`[data-rs="${f.id}"]`),
  }));
}

function renderLevels() {
  if (!levelNodes) cacheLevelNodes();
  for (const n of levelNodes) {
    const v = chan(n.f.universe, n.f.address);
    setText(n.val, v);
    const height = (v / 255 * 100) + '%';
    if (n.bar && n.bar.style.height !== height) n.bar.style.height = height;
    if (n.slider && document.activeElement !== n.slider && +n.slider.value !== v) {
      n.slider.value = v;
    }
    const cls = 'rs' + (state.redstone[String(n.f.id)] ? ' on' : '');
    if (n.rs && n.rs.className !== cls) n.rs.className = cls;
  }
}

function chan(universe, address) {
  const uni = state.dmx[String(universe)];
  return uni ? (uni[address - 1] || 0) : 0;
}

/* ---- blocks ----------------------------------------------------------

   Most placed blocks are not fixtures: a dimmer or sound meter feeds the
   console, an event block triggers it. Only a feedback block takes a level
   back from the console, so it is the one that behaves like a fixture.
   Blocks are grouped by that role rather than by which engine tracks them. */

const ROLES = [
  {id:'INPUT',   label:'Inputs',   blurb:'World state driving a DMX channel'},
  {id:'TRIGGER', label:'Triggers', blurb:'Edges firing an event at the console'},
  {id:'FIXTURE', label:'Fixtures', blurb:'Console levels acting back on the world'},
];

let roleFilter = null;

function allBlocks() {
  return [...(state.blocks || []), ...(state.sound || [])];
}

function setRoleFilter(role) {
  roleFilter = roleFilter === role ? null : role;
  renderRoleFilter();
  renderBlocks();
}

function renderRoleFilter() {
  const counts = {};
  for (const b of allBlocks()) counts[b.role] = (counts[b.role] || 0) + 1;
  const html = ROLES.map(r =>
    `<button class="${roleFilter === r.id ? 'active' : ''}" onclick="setRoleFilter('${r.id}')">
       ${r.label} ${counts[r.id] || 0}</button>`).join('');
  setHtml('roleFilter', html);
}

function renderBlocks() {
  const blocks = allBlocks();
  document.getElementById('blocksEmpty').hidden = blocks.length > 0;
  const html = ROLES.map(role => {
    if (roleFilter && roleFilter !== role.id) return '';
    const inRole = blocks.filter(b => b.role === role.id);
    if (!inRole.length) return '';
    return `<div class="group">
      <h3>${role.label}</h3>
      <p class="blurb">${role.blurb}</p>
      <div class="cards">${inRole.map(blockCard).join('')}</div>
    </div>`;
  }).join('');
  setHtml('blocks', html);
}

function blockCard(b) {
  return b.sound ? soundCard(b) : fixtureBlockCard(b);
}

function fixtureBlockCard(b) {
  const swatch = b.color
    ? `<div class="swatch" style="background:${esc(b.color)}" title="${esc(b.color)}"></div>` : '';
  let extra = '';
  if (b.type === 'FEEDBACK') {
    const level = b.feedbackLevel ?? 0;
    extra = `<div class="row" style="margin:8px 0 0">
               <span class="pill">console → redstone</span>
               <span style="color:var(--accent-2)">${level}/15</span>
               <div class="meter" style="flex:1"><i style="width:${level / 15 * 100}%"></i></div>
             </div>`;
  }
  return `<div class="card">
    <div class="head">
      ${swatch}
      <div>
        <div class="title">${esc(b.name)}</div>
        <div class="id">#${b.id} · ${esc(b.type)}</div>
      </div>
      <span class="tag role-${esc(b.role)}">${esc(b.role)}</span>
    </div>
    <div class="pos">${b.x}, ${b.y}, ${b.z}</div>
    ${portTable(b)}
    ${extra}</div>`;
}

function portTable(b) {
  const rows = (b.ports || []).map(p => {
    const raw = p.raw || 0;
    if (p.action === 'EMIT_EVENT') {
      return `<tr>
        <td>${esc(p.name)}</td>
        <td>${esc(p.side)}</td>
        <td colspan="2">${esc(p.event || '—')}</td>
        <td class="num">${raw}/15</td>
        <td class="num" title="times fired">${p.fires || 0}×</td>
      </tr>`;
    }
    const dmx = p.dmx || 0;
    return `<tr>
      <td>${esc(p.name)}</td>
      <td>${esc(p.side)}</td>
      <td>u${p.universe}.${p.channel}</td>
      <td style="width:35%"><div class="meter"><i style="width:${dmx / 255 * 100}%"></i></div></td>
      <td class="num">${raw}/15</td>
      <td class="num">${dmx}</td>
    </tr>`;
  }).join('');
  return `<table class="ports">
    <tr><th>port</th><th>side</th><th>target</th><th></th><th>in</th><th>out</th></tr>
    ${rows}</table>`;
}

function soundCard(b) {
  const swatch = b.color
    ? `<div class="swatch" style="background:${esc(b.color)}" title="${esc(b.color)}"></div>` : '';
  const out = (b.dmx || []).join(' / ');
  const note = b.mode === 'NOTE'
    ? `<span>note</span><span>${b.lastNote < 0 ? '—' : b.lastNote + ' ' + esc(b.lastInstrument || '')}</span>` : '';
  const beat = b.mode === 'BEAT'
    ? `<span>beat</span><span><span class="beat${b.beat ? ' on' : ''}"></span>
         thr ${fmt(b.beatThreshold)} · avg ${fmt(b.runningAvg)}</span>` : '';
  return `<div class="card">
    <div class="head">
      ${swatch}
      <div>
        <div class="title">${esc(b.name)}</div>
        <div class="id">#${b.id} · ${esc(b.mode)}</div>
      </div>
      <span class="tag role-${esc(b.role)}">${esc(b.role)}</span>
    </div>
    <div class="pos">${b.x}, ${b.y}, ${b.z} · radius ${b.radius}</div>
    <div class="kv">
      <span>output</span><span>u${b.universe}.${b.channel} → ${out || 0}</span>
      <span>input</span><span><div class="meter cool"><i style="width:${clampPct(b.level)}%"></i></div></span>
      <span>envelope</span><span><div class="meter"><i style="width:${clampPct(b.envelope)}%"></i></div></span>
      <span>gain</span><span>${fmt(b.gain)} · decay ${fmt(b.decay)}</span>
      ${note}
      ${beat}
    </div></div>`;
}

/* ---- devices ---- */

function renderDevices() {
  setHtml('devices', (state.devices || []).map(d => {
    const fields = deviceFields(d);
    return `<div class="card">
      <div class="head">
        <div class="title">${esc(d.name)}</div>
        <span class="tag">${d.running ? 'RUNNING' : 'IDLE'}</span>
      </div>
      ${fields ? `<div class="kv">${fields}</div>` : ''}
      ${peerTable(d.peers)}</div>`;
  }).join(''));
}

function deviceFields(d) {
  const parts = [];
  if (d.port) parts.push(['port', d.port]);
  if (d.bind) parts.push(['bind', d.bind]);
  if (d.input !== undefined) parts.push(['input', d.input ? 'enabled' : 'off']);
  if (d.outputUniverses) parts.push(['out universes', d.outputUniverses.join(', ') || '—']);
  if (d.inputUniverses) parts.push(['in universes', d.inputUniverses.join(', ') || '—']);
  if (d.universes) {
    parts.push(['universes', d.universes
      .map(u => `u${u.universe}${u.enabled ? '' : ' (off)'} @p${u.priority}`).join(', ') || '—']);
  }
  return parts.map(([k, v]) => `<span>${esc(k)}</span><span>${esc(v)}</span>`).join('');
}

function peerTable(peers) {
  if (!peers || !peers.length) {
    return '<div class="empty">nothing has connected</div>';
  }
  const now = Date.now();
  const rows = peers.map(p => {
    const age = p.lastSeen ? now - p.lastSeen : null;
    return `<tr class="${age !== null && age > 5000 ? 'stale' : ''}">
      <td>${esc(p.address)}</td>
      <td>${esc(p.detail || '')}</td>
      <td>${p.packets !== undefined ? p.packets : ''}</td>
      <td>${age === null ? '' : ago(age)}</td>
    </tr>`;
  }).join('');
  return `<table class="grid" style="margin-top:8px">
    <tr><th>peer</th><th>last</th><th>pkts</th><th>seen</th></tr>${rows}</table>`;
}

/* ---- signals ---- */

function togglePause() {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
  if (!paused) renderSignals();
}

function renderSignals() {
  if (paused) return;
  const filter = document.getElementById('signalFilter').value.trim().toLowerCase();
  const rows = events
    .filter(e => !filter || e.kind.toLowerCase().includes(filter))
    .slice(0, MAX_SIGNALS)
    .map(e => `<tr>
      <td class="time">${clock(e.at)}</td>
      <td class="kind ${kindClass(e.kind)}">${esc(e.kind)}</td>
      <td class="data">${esc(summarise(e.data))}</td>
    </tr>`).join('');
  setHtml('signals', rows ? `<table>${rows}</table>` : '<div class="empty">no signals yet</div>');
}

function kindClass(kind) {
  if (kind.startsWith('block.')) return 'k-block';
  if (kind.startsWith('sound.')) return 'k-sound';
  if (kind.startsWith('redstone.')) return 'k-redstone';
  // signals arriving from outside MineLight rather than generated inside it
  if (kind.startsWith('control.') || kind.startsWith('artnet.')
      || kind.startsWith('midi.') || kind.startsWith('mqtt.')) return 'k-in';
  return 'k-other';
}

function summarise(data) {
  if (!data) return '';
  return Object.entries(data).map(([k, v]) => k + '=' + v).join('  ');
}

/* ---- controls ---- */

function renderPresets() {
  setHtml('presets', (state.presets || [])
    .map(p => `<button onclick="applyPreset('${esc(p)}')">${esc(p)}</button>`).join(''));
}

function applyPreset(name) { send({type:'preset', name}); }

function onSlider(id, v) { send({type:'intensity', fixtureId:id, value:+v}); }
function savePreset() {
  const name = document.getElementById('presetName').value.trim();
  if (!name) return;
  const levels = {};
  for (const f of (state.patch.fixtures || [])) {
    levels[f.id] = [ chan(f.universe, f.address) ];
  }
  send({type:'savePreset', name, levels});
}
function cueGo() { send({type:'cue', list:'main'}); }
function cueGoIndex() { send({type:'cue', list:'main', index:+document.getElementById('cueIndex').value}); }
function reloadScript() { send({type:'script', script:document.getElementById('script').value}); log('script applied'); }

/* ---- helpers ---- */

// Writing innerHTML tears down and rebuilds a subtree even when the markup is
// identical, and every mutation wakes each MutationObserver on the page —
// including those browser extensions install. Skipping unchanged writes is
// what keeps an idle console at zero CPU.
const painted = {};
function setHtml(id, html) {
  if (painted[id] === html) return false;
  painted[id] = html;
  document.getElementById(id).innerHTML = html;
  return true;
}
function setText(el, text) {
  if (el && el.textContent !== String(text)) el.textContent = text;
}

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(n){ return (Math.round((n || 0) * 100) / 100).toFixed(2); }
function clampPct(v){ return Math.max(0, Math.min(1, v || 0)) * 100; }
function clock(ms){ return new Date(ms).toLocaleTimeString(undefined, {hour12:false}) ; }
function ago(ms){
  if (ms < 1000) return 'now';
  if (ms < 60000) return Math.round(ms / 1000) + 's';
  if (ms < 3600000) return Math.round(ms / 60000) + 'm';
  return Math.round(ms / 3600000) + 'h';
}
const MAX_LOG = 100;
function log(m){
  const l = document.getElementById('log');
  const line = document.createElement('div');
  line.textContent = m;
  l.appendChild(line);
  while (l.childElementCount > MAX_LOG) l.removeChild(l.firstChild);
  l.scrollTop = l.scrollHeight;
}

renderTabs();
connect();
</script>
</body>
